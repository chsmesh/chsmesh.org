# The container runs as the unprivileged nginx user (Dockerfile: USER nginx),
# so the pid file and temp directories live under /tmp, which is world-writable
# however the runtime mounts it. /var/cache/nginx and /run are root-owned in the
# stock nginx:alpine image and a tmpfs mounted over them is not guaranteed to
# be writable by uid 101 (GitHub Actions' Docker creates it root-owned).
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp paths writable by the unprivileged runtime user (see the pid note).
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # Enable HSTS only when requests originate from HTTPS at the TLS edge.
    map $http_x_forwarded_proto $hsts_header {
        default "";
        https "max-age=63072000; includeSubDomains; preload";
    }

    # Logging to container streams (read-only filesystem friendly)
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Public submission endpoint: a few requests per minute per client
    # address; bursts beyond that get a 429 (see `location ^~ /api/`).
    limit_req_zone $binary_remote_addr zone=submissions:1m rate=10r/m;
    limit_req_status 429;

    # The Sveltia CMS at /admin/ talks to GitHub and loads WebAssembly. These
    # variables are spliced into the shared CSP in security-headers.conf, so
    # the admin page gets a wider policy without a second add_header set
    # (which would need its own include and could drift). Empty everywhere else.
    map $uri $csp_admin_connect {
        default   "";
        ~^/admin/ "https://api.github.com https://github.com https://raw.githubusercontent.com https://*.githubusercontent.com";
    }
    map $uri $csp_admin_script {
        default   "";
        ~^/admin/ "'wasm-unsafe-eval'";
    }
    map $uri $csp_admin_extra {
        default   "";
        ~^/admin/ "worker-src 'self' blob:; child-src 'self' blob:;";
    }

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers. nginx drops every inherited add_header in any
        # location that declares an add_header of its own, so this file is
        # re-included in every location below that calls add_header.
        include /etc/nginx/security-headers.conf;

        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Legacy .md URLs are live today; redirect them to the clean URLs.
        rewrite "^/guides/(.+)\.md/?$" /guides/$1/ permanent;
        rewrite "^/meetups/(.+)\.md/?$" /meetups/$1/ permanent;

        # Deny access to hidden files. Declared before the asset regex below so
        # it wins nginx's first-match-wins regex ordering.
        location ~ /\. {
            deny all;
        }

        # Docker's embedded DNS. proxy_pass below goes through a variable so
        # nginx resolves the upstream per request instead of at startup: the
        # image still passes `nginx -t` at build time and serves the static
        # site even when the submissions container is absent (CI smoke tests,
        # local previews), in which case /api/ answers 502.
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Public form submissions and the CMS OAuth handshake, proxied to the
        # submissions service (services/submissions). No add_header here, so
        # the server-level security headers are inherited onto its responses.
        location ^~ /api/ {
            limit_req zone=submissions burst=5 nodelay;
            client_max_body_size 64k;
            set $submissions_upstream http://submissions:3000;
            proxy_pass $submissions_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        # Sveltia CMS shell and its config.yml. Never cache or index it. The
        # `^~` prefix beats the .html regex location below.
        location ^~ /admin/ {
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ =404;
        }

        # Hashed Astro build output only - safe to cache immutably for a year.
        # Unhashed assets such as /favicon.svg deliberately fall through to the
        # shorter cache below.
        location ^~ /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        # Other static assets - these are not content hashed, so cache briefly.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            include /etc/nginx/security-headers.conf;
        }

        # HTML files - short cache for updates
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
        }

        # Static site: an unknown path is a real 404, not an index.html rewrite.
        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;

        location = /404.html {
            internal;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
