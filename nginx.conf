user nginx;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # Enable HSTS only when requests originate from HTTPS at the TLS edge.
    map $http_x_forwarded_proto $hsts_header {
        default "";
        https "max-age=63072000; includeSubDomains; preload";
    }

    # Logging to container streams (read-only filesystem friendly)
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers. nginx drops every inherited add_header in any
        # location that declares an add_header of its own, so this file is
        # re-included in every location below that calls add_header.
        include /etc/nginx/security-headers.conf;

        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Legacy .md URLs are live today; redirect them to the clean URLs.
        rewrite "^/guides/(.+)\.md/?$" /guides/$1/ permanent;
        rewrite "^/meetups/(.+)\.md/?$" /meetups/$1/ permanent;

        # Deny access to hidden files. Declared before the asset regex below so
        # it wins nginx's first-match-wins regex ordering.
        location ~ /\. {
            deny all;
        }

        # Hashed Astro build output only - safe to cache immutably for a year.
        # Unhashed assets such as /favicon.svg deliberately fall through to the
        # shorter cache below.
        location ^~ /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        # Other static assets - these are not content hashed, so cache briefly.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            include /etc/nginx/security-headers.conf;
        }

        # HTML files - short cache for updates
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
        }

        # Static site: an unknown path is a real 404, not an index.html rewrite.
        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;

        location = /404.html {
            internal;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
