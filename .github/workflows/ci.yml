name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cloudflare's documented "always passes" test site key, so the build
  # exercises the Turnstile path (script tag, widget slot) without a real widget.
  PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Pushes to main and release/** always run every job; pull requests run
      # the image build and container jobs only when something outside the
      # content paths changed.
      container: ${{ github.event_name != 'pull_request' || steps.filter.outputs.container == 'true' }}

    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # `every`: a file counts only if it matches all the negated
          # patterns, i.e. it lies outside every content path. A pull request
          # that touches only content therefore leaves `container` false.
          predicate-quantifier: every
          filters: |
            container:
              - '!src/content/**'
              - '!public/images/**'
              - '!docs/**/*.md'

  site:
    name: Site - test, build, and check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run site tests
        # test/submissions/ runs in the submissions job, on the service's own
        # Node version. Locally, `npm test` still runs every suite.
        run: npm run test:site

      - name: Build site
        run: npm run build

      - name: Assert no inline executable scripts in the build
        run: |
          # nginx serves a Content-Security-Policy with script-src 'self', so
          # any <script> without a src attribute (other than inert JSON data
          # islands) would be blocked in the browser. astro.config.mjs sets
          # assetsInlineLimit: 0 to keep hoisted scripts external; this guards
          # against that regressing silently.
          if grep -rlE '<script( type="module")?>' dist --include='*.html'; then
            echo 'Found inline executable <script> tags in dist/ (listed above); the CSP would block them.' >&2
            exit 1
          fi
          echo 'No inline executable scripts in dist/.'

      - name: Type and content schema check
        run: npm run check

  submissions:
    name: Submissions service - tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The service has no dependencies and targets Node 22 (its package.json
      # engines and Dockerfile base image), so there is no npm ci here.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run submissions service tests
        run: npm run test:submissions

  submissions-image:
    name: Submissions service - image build
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build service image
        run: docker build -t chsmesh-submissions:ci services/submissions

      - name: Smoke test - service starts and answers /healthz
        run: |
          # With no environment the service logs warnings and starts anyway;
          # /healthz needs no configuration.
          docker run -d --name submissions-ci --read-only \
            -p 3000:3000 chsmesh-submissions:ci
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/healthz; then
              echo
              echo 'Submissions service is answering /healthz.'
              exit 0
            fi
            sleep 2
          done
          echo 'Submissions service did not answer /healthz within 30s.' >&2
          docker logs submissions-ci >&2 || true
          exit 1

      - name: Container logs
        if: always()
        run: docker logs submissions-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f submissions-ci || true

  container:
    name: Container - build and smoke test
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build \
            --build-arg PUBLIC_TURNSTILE_SITE_KEY="$PUBLIC_TURNSTILE_SITE_KEY" \
            -t chsmesh:ci .

      - name: Start container
        run: |
          # The image runs nginx as an unprivileged user with its pid and temp
          # files under /tmp, so /tmp must be writable; the other two tmpfs
          # mounts match docker-compose*.yml. --read-only mirrors the
          # production hardening so the smoke test exercises it.
          # A user-defined network, like compose and the production host
          # network, provides Docker's embedded DNS at 127.0.0.11, which the
          # /api/ resolver in nginx.conf relies on. On the default bridge
          # nothing answers there and /api/ hangs for the 30s resolver
          # timeout before its 502.
          docker network create chsmesh-ci
          docker run -d --name chsmesh-ci --read-only \
            --network chsmesh-ci \
            --tmpfs /var/cache/nginx --tmpfs /var/run --tmpfs /tmp \
            -p 8080:8080 chsmesh:ci
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              echo "Container is serving on port 8080."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not start serving within 60s." >&2
          docker logs chsmesh-ci >&2 || true
          exit 1

      - name: Smoke test - home page status and security headers
        run: |
          # nginx emits HSTS only for requests forwarded as HTTPS, which is how
          # the TLS edge calls the container in production.
          headers=$(curl -sS -D - -o /dev/null \
            -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8080/)
          printf '%s\n' "$headers"

          status_line=$(printf '%s\n' "$headers" | head -n 1)
          case "$status_line" in
            *' 200'*) ;;
            *) echo "Expected 200 for /, got: $status_line" >&2; exit 1 ;;
          esac

          printf '%s\n' "$headers" | grep -qi '^content-security-policy:' \
            || { echo 'Missing Content-Security-Policy header on /' >&2; exit 1; }
          # The Turnstile script and challenge iframe must be allowed on pages.
          printf '%s\n' "$headers" | grep -i '^content-security-policy:' \
            | grep -q "script-src 'self' https://challenges.cloudflare.com" \
            || { echo 'CSP script-src does not allow Turnstile on /' >&2; exit 1; }
          printf '%s\n' "$headers" | grep -i '^content-security-policy:' \
            | grep -q "frame-src 'self' https://challenges.cloudflare.com" \
            || { echo 'CSP frame-src does not allow Turnstile on /' >&2; exit 1; }
          printf '%s\n' "$headers" | grep -qi '^strict-transport-security:' \
            || { echo 'Missing Strict-Transport-Security header on /' >&2; exit 1; }

      - name: Smoke test - guide route returns 200
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/guides/what-is-meshtastic/)
          if [ "$status" != "200" ]; then
            echo "Expected 200 for /guides/what-is-meshtastic/, got $status" >&2
            exit 1
          fi

      - name: Smoke test - legacy .md guide URL redirects to the clean URL
        run: |
          # nginx.conf rewrites the legacy `/guides/<name>.md/` URLs that are
          # live today onto the clean URLs the site now emits. Assert both the
          # 301 status and the Location target, so a dropped rewrite fails here
          # rather than silently 404ing inbound links.
          response=$(curl -sS -D - -o /dev/null \
            http://127.0.0.1:8080/guides/what-is-meshtastic.md/)
          printf '%s\n' "$response"

          status=$(printf '%s\n' "$response" | head -n 1)
          case "$status" in
            *' 301'*) ;;
            *) echo "Expected 301 for /guides/what-is-meshtastic.md/, got: $status" >&2; exit 1 ;;
          esac

          location=$(printf '%s\n' "$response" \
            | tr -d '\r' \
            | sed -n 's/^[Ll]ocation: *//p' \
            | tail -n 1)
          case "$location" in
            */guides/what-is-meshtastic/) ;;
            *) echo "Expected redirect to /guides/what-is-meshtastic/, got: '$location'" >&2; exit 1 ;;
          esac

      - name: Smoke test - unknown route returns 404 with security headers
        run: |
          # The 404 page is served from its own `location = /404.html` block,
          # which declares add_header and must therefore re-include
          # security-headers.conf; assert the CSP survives there.
          headers=$(curl -sS -D - -o /dev/null http://127.0.0.1:8080/definitely-missing/)
          printf '%s\n' "$headers"
          status_line=$(printf '%s\n' "$headers" | head -n 1)
          case "$status_line" in
            *' 404'*) ;;
            *) echo "Expected 404 for /definitely-missing/, got: $status_line" >&2; exit 1 ;;
          esac
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:' \
            || { echo 'Missing Content-Security-Policy header on the 404 response' >&2; exit 1; }

      - name: Smoke test - hashed asset is cached and keeps security headers
        run: |
          # /_astro/ assets come from a `location ^~ /_astro/` block with its own
          # add_header lines, so it too must re-include security-headers.conf.
          # This job does not build dist/ on the runner, so use the
          # stylesheet the home page links to.
          path=$(curl -fsS http://127.0.0.1:8080/ \
            | grep -oE '/_astro/[A-Za-z0-9._-]+\.css' | head -n 1)
          if [ -z "$path" ]; then
            echo 'No /_astro/*.css stylesheet linked from /' >&2
            exit 1
          fi
          headers=$(curl -sS -D - -o /dev/null "http://127.0.0.1:8080$path")
          printf '%s\n' "$headers"
          status_line=$(printf '%s\n' "$headers" | head -n 1)
          case "$status_line" in
            *' 200'*) ;;
            *) echo "Expected 200 for $path, got: $status_line" >&2; exit 1 ;;
          esac
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:' \
            || { echo "Missing Content-Security-Policy header on $path" >&2; exit 1; }
          printf '%s\n' "$headers" | grep -qi '^cache-control:.*immutable' \
            || { echo "Expected an immutable Cache-Control on $path" >&2; exit 1; }

      - name: Smoke test - /api/ returns 502 with security headers when no upstream
        run: |
          # nginx.conf proxies /api/ through a variable and Docker's DNS
          # resolver, so the image starts and serves the site with no
          # submissions container present. Assert that case is a 502 that
          # still carries the server-level security headers (the location
          # declares no add_header of its own, so it inherits them), and that
          # nginx keeps serving afterwards. The 10s cap fails fast if name
          # resolution hangs instead of failing immediately.
          headers=$(curl -sS -D - -o /dev/null --max-time 10 \
            -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8080/api/healthz)
          printf '%s\n' "$headers"
          status_line=$(printf '%s\n' "$headers" | head -n 1)
          case "$status_line" in
            *' 502'*) ;;
            *) echo "Expected 502 for /api/healthz with no upstream, got: $status_line" >&2; exit 1 ;;
          esac
          for header in content-security-policy strict-transport-security \
            x-frame-options x-content-type-options referrer-policy permissions-policy; do
            printf '%s\n' "$headers" | grep -qi "^$header:" \
              || { echo "Missing $header header on the /api/healthz 502" >&2; exit 1; }
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/ \
            || { echo 'Container stopped serving / after the /api/ request' >&2; exit 1; }

      - name: Smoke test - image also starts with no mounts at all
        run: |
          # Production (Komodo) runs the image with a plain `docker run`: no
          # --read-only and no tmpfs over /tmp. That exposes anything the
          # build stage left in the image that the unprivileged runtime user
          # cannot use (a root-owned /tmp/nginx.pid once crash-looped
          # production while the tmpfs runs above passed), so exercise it.
          docker run -d --name chsmesh-ci-plain -p 8090:8080 chsmesh:ci
          for _ in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:8090/; then
              echo "Plain container is serving on port 8090."
              exit 0
            fi
            sleep 2
          done
          echo "Plain container (no tmpfs, not read-only) did not start serving within 30s." >&2
          docker logs chsmesh-ci-plain >&2 || true
          exit 1

      - name: Container logs
        if: always()
        run: docker logs chsmesh-ci || true

      - name: Stop containers
        if: always()
        run: |
          docker rm -f chsmesh-ci chsmesh-ci-plain || true
          docker network rm chsmesh-ci || true

  ci-ok:
    # The single required status check. It always runs, fails if any job it
    # needs failed or was cancelled, and passes when the image build and
    # container jobs were skipped for a content-only pull request.
    name: ci-ok
    needs: [changes, site, submissions, submissions-image, container]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          printf '%s\n' "$RESULTS"
          if [ "$FAILED" = 'true' ]; then
            echo 'One or more CI jobs failed or were cancelled.' >&2
            exit 1
          fi
          echo 'All CI jobs passed or were skipped.'
