services:
  # Same-origin form submissions and CMS sign-in (services/submissions).
  # Not published on a host port: nginx proxies /api/ to it on the compose
  # network. Point PUBLIC_N8N_*_WEBHOOK_URL at /api/submit/<kind> to use it.
  submissions:
    build:
      context: ./services/submissions
    env_file:
      - path: .env
        required: false
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8081}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  chsmesh:
    depends_on:
      - submissions
    build:
      context: .
      dockerfile: Dockerfile
      # Forwarded from the shell environment or .env so a documented
      # `docker compose build` produces working submission forms and a CSP
      # connect-src that allows the n8n webhook host. These are PUBLIC_ values
      # baked into the static output at build time - rotating them requires a
      # rebuild, not just a restart.
      args:
        PUBLIC_N8N_WEBHOOK_URL: ${PUBLIC_N8N_WEBHOOK_URL:-}
        PUBLIC_N8N_GUIDES_WEBHOOK_URL: ${PUBLIC_N8N_GUIDES_WEBHOOK_URL:-}
        PUBLIC_N8N_MEETUPS_WEBHOOK_URL: ${PUBLIC_N8N_MEETUPS_WEBHOOK_URL:-}
        PUBLIC_N8N_RESOURCES_WEBHOOK_URL: ${PUBLIC_N8N_RESOURCES_WEBHOOK_URL:-}
    user: "101:101"
    ports:
      - "8081:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
