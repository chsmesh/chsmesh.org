services:
  # Same-origin form submissions and CMS sign-in (services/submissions).
  # Not published on a host port: nginx proxies /api/ to it on the compose
  # network; the public forms POST to /api/submit/<kind>.
  submissions:
    build:
      context: ./services/submissions
    env_file:
      - path: .env
        required: false
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8081}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  chsmesh:
    depends_on:
      - submissions
    build:
      context: .
      dockerfile: Dockerfile
      # Forwarded from the shell environment or .env. These are PUBLIC_ values
      # baked into the static output at build time - changing them requires a
      # rebuild, not just a restart.
      args:
        PUBLIC_SUBMIT_BASE: ${PUBLIC_SUBMIT_BASE:-}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    user: "101:101"
    ports:
      - "8081:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
