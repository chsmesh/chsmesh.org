# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS configuration for chsmesh.org (served at /admin/).
#
# Editors sign in with GitHub through the same-origin OAuth handshake in the
# submissions service (/api/auth). Every save lands on a `cms/<collection>/<slug>`
# branch with a pull request, so nothing reaches `main` without review.
# Field definitions mirror src/content/config.ts; keep the two in sync.

backend:
  name: github
  repo: chsmesh/chsmesh.org
  branch: main
  # The same-origin authenticator (base_url + auth_endpoint) is injected by
  # src/pages/admin/index.astro from the page's own origin, so this file works
  # unchanged in production and in a local Docker stack.
  auth_scope: public_repo
  cms_label_prefix: "cms/"
  squash_merges: true
  commit_messages:
    create: "content({{collection}}): add {{slug}}"
    update: "content({{collection}}): update {{slug}}"
    delete: "content({{collection}}): remove {{slug}}"
    uploadMedia: "media: add {{path}}"
    deleteMedia: "media: remove {{path}}"

publish_mode: editorial_workflow
site_url: https://chsmesh.org
display_url: https://chsmesh.org
logo_url: /favicon.svg

media_folder: /public/images
public_folder: /images

output:
  # The Astro collections use zod .optional(); an empty optional field must be
  # absent from the file, not written as null or "" (which fails z.coerce.date).
  omit_empty_optional_fields: true

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: meetups
    label: Meetups
    label_singular: Meetup
    folder: src/content/meetups
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      # The picker works in Charleston time whatever the editor's own zone, and
      # the value is saved with its offset (2026-10-03T18:00:00-04:00), so the
      # build reads the right instant. The site displays it in the same zone.
      - { name: date, label: Start, widget: datetime, input_timezone: America/New_York, hint: Charleston time }
      - { name: endDate, label: End, widget: datetime, input_timezone: America/New_York, hint: Charleston time, required: false }
      - { name: location, label: Location name, widget: string }
      - { name: address, label: Street address, widget: string, required: false }
      - { name: description, label: Description, widget: text }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: rsvpLink, label: RSVP link, widget: string, type: url, required: false }
      - name: coordinates
        label: Coordinates
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: lat, label: Latitude, widget: number, value_type: float, min: -90, max: 90 }
          - { name: lng, label: Longitude, widget: number, value_type: float, min: -180, max: 180 }
      - { name: maxAttendees, label: Max attendees, widget: number, value_type: int, required: false }
      - name: recurring
        label: Recurring
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: frequency, label: Frequency, widget: select, options: [weekly, biweekly, monthly] }
          - { name: day, label: Day, widget: string, required: false, hint: "e.g. first Tuesday" }
      - { name: body, label: Event details, widget: markdown }

  - name: guides
    label: Guides
    label_singular: Guide
    folder: src/content/guides
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{difficulty}})"
    sortable_fields: [order, title, lastUpdated]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - name: difficulty
        label: Difficulty
        widget: select
        options:
          - { label: Beginner, value: beginner }
          - { label: Intermediate, value: intermediate }
          - { label: Advanced, value: advanced }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Getting Started, value: getting-started }
          - { label: Hardware, value: hardware }
          - { label: Software, value: software }
          - { label: Network, value: network }
          - { label: Troubleshooting, value: troubleshooting }
      - { name: order, label: Order, widget: number, value_type: int, default: 0, hint: "Lower numbers list first" }
      - { name: readingTime, label: Reading time (minutes), widget: number, value_type: int, required: false }
      - { name: prerequisites, label: Prerequisites, widget: list, required: false, field: { name: item, label: Prerequisite, widget: string } }
      - { name: lastUpdated, label: Last updated, widget: datetime, type: date, required: false }
      - { name: author, label: Author, widget: string, required: false }
      - { name: body, label: Guide content, widget: markdown }

  - name: resources
    label: Resources
    label_singular: Resource
    folder: src/content/resources
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Devices, value: devices }
          - { label: Accessories, value: accessories }
          - { label: Software, value: software }
          - { label: Firmware, value: firmware }
          - { label: Community, value: community }
      - { name: order, label: Order, widget: number, value_type: int, default: 0 }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - name: links
        label: Links
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string, type: url }
          - { name: type, label: Type, widget: select, required: false, options: [purchase, docs, download, community] }
      - { name: priceRange, label: Price range, widget: string, required: false, hint: "e.g. $18-25" }
      - { name: pros, label: Pros, widget: list, required: false, field: { name: item, label: Pro, widget: string } }
      - { name: cons, label: Cons, widget: list, required: false, field: { name: item, label: Con, widget: string } }
      - { name: image, label: Image, widget: image, required: false }
      - { name: body, label: Detailed information, widget: markdown }

  - name: nodes
    label: Map nodes
    label_singular: Node
    folder: src/content/nodes
    create: true
    extension: json
    format: json
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}} ({{type}})"
    sortable_fields: [name, type, lastSeen]
    editor: { preview: false }
    fields:
      - { name: name, label: Node name, widget: string }
      - { name: description, label: Description, widget: text, required: false }
      - name: coordinates
        label: Coordinates
        widget: object
        fields:
          - { name: lat, label: Latitude, widget: number, value_type: float, min: -90, max: 90 }
          - { name: lng, label: Longitude, widget: number, value_type: float, min: -180, max: 180 }
      - { name: type, label: Type, widget: select, options: [client, router, relay, solar], default: client }
      - { name: elevation, label: Elevation (feet), widget: number, value_type: int, required: false }
      - { name: active, label: Active, widget: boolean, default: true }
      - { name: owner, label: Owner, widget: string, required: false }
      - { name: lastSeen, label: Last seen, widget: datetime, type: date, required: false }

  - name: taxonomies
    label: Taxonomies
    editor: { preview: false }
    files:
      - name: default
        label: Labels and icons
        file: src/content/taxonomies/default.md
        fields:
          - name: guideCategories
            label: Guide categories
            widget: list
            fields:
              - { name: key, label: Key, widget: string }
              - { name: label, label: Label, widget: string }
              - { name: description, label: Description, widget: string, required: false }
              - { name: icon, label: Icon, widget: string, required: false }
          - name: guideDifficulties
            label: Guide difficulties
            widget: list
            fields:
              - { name: key, label: Key, widget: string }
              - { name: label, label: Label, widget: string }
              - { name: description, label: Description, widget: string, required: false }
              - { name: icon, label: Icon, widget: string, required: false }
          - name: resourceCategories
            label: Resource categories
            widget: list
            fields:
              - { name: key, label: Key, widget: string }
              - { name: label, label: Label, widget: string }
              - { name: description, label: Description, widget: string, required: false }
              - { name: icon, label: Icon, widget: string, required: false }
          - name: meetupStatuses
            label: Meetup statuses
            widget: list
            fields:
              - { name: key, label: Key, widget: string }
              - { name: label, label: Label, widget: string }
              - { name: description, label: Description, widget: string, required: false }
              - { name: icon, label: Icon, widget: string, required: false }
          - name: meetupBadges
            label: Meetup badges
            widget: list
            fields:
              - { name: key, label: Key, widget: string }
              - { name: label, label: Label, widget: string }
              - { name: description, label: Description, widget: string, required: false }
              - { name: icon, label: Icon, widget: string, required: false }

  # Site-wide copy lives in src/content/global as one file per page. Each entry
  # mirrors its branch of the discriminated union in src/content/config.ts; the
  # hidden `type` field writes the discriminator. Arrays with .default([]) are
  # `required: false` so an emptied list is omitted and zod fills in [].
  - name: global
    label: Site settings
    editor: { preview: false }
    files:
      - name: site
        label: Site metadata
        file: src/content/global/site.md
        fields:
          - { name: type, widget: hidden, default: site }
          - { name: title, label: Site title, widget: string }
          - { name: description, label: Site description, widget: text }
          - { name: links, label: Shared links, widget: keyvalue, required: false, key_label: Name, value_label: URL }
      - name: navigation
        label: Navigation
        file: src/content/global/navigation.md
        fields:
          - { name: type, widget: hidden, default: navigation }
          - { name: title, label: Title, widget: string, required: false }
          - name: links
            label: Links
            widget: list
            summary: "{{fields.label}} → {{fields.href}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Href, widget: string }
              - { name: external, label: Opens in new tab, widget: boolean, required: false }
      - name: footer
        label: Footer
        file: src/content/global/footer.md
        fields:
          - { name: type, widget: hidden, default: footer }
          - { name: brandName, label: Brand name, widget: string }
          - name: about
            label: About
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
          - name: quickLinks
            label: Quick links
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: links
                label: Links
                widget: list
                summary: "{{fields.label}} → {{fields.href}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: external, label: Opens in new tab, widget: boolean, required: false }
          - name: community
            label: Community
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: links
                label: Links
                widget: list
                summary: "{{fields.label}} → {{fields.href}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: external, label: Opens in new tab, widget: boolean, required: false }
          - name: legal
            label: Legal
            widget: object
            fields:
              - { name: copyright, label: Copyright, widget: string }
              - { name: trademark, label: Trademark notice, widget: string }
      - name: home
        label: Home page
        file: src/content/global/home.md
        fields:
          - { name: type, widget: hidden, default: home }
          - { name: pageTitle, label: Page title, widget: string }
          - { name: pageDescription, label: Page description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string }
              - { name: size, label: Size, widget: select, required: false, options: [small, large] }
              - name: ctas
                label: Buttons
                widget: list
                required: false
                summary: "{{fields.label}} → {{fields.href}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
          - name: stats
            label: Stats
            widget: list
            required: false
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
          - name: intro
            label: Intro
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
          - name: features
            label: Features
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: icon, label: Icon, widget: string }
          - name: meetupsSection
            label: Meetups section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
          - name: guidesSection
            label: Guides section
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
          - name: cta
            label: Call to action
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: ctas
                label: Buttons
                widget: list
                required: false
                summary: "{{fields.label}} → {{fields.href}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
      - name: meetups
        label: Meetups page
        file: src/content/global/meetups.md
        fields:
          - { name: type, widget: hidden, default: meetups }
          - { name: pageTitle, label: Page title, widget: string }
          - { name: pageDescription, label: Page description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string }
              - { name: size, label: Size, widget: select, required: false, options: [small, large] }
          - { name: upcomingHeading, label: Upcoming heading, widget: string }
          - { name: pastHeading, label: Past heading, widget: string }
          - name: empty
            label: Empty state
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
          - name: host
            label: Host a meetup
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
      - name: meetups-detail
        label: Meetup detail page
        file: src/content/global/meetups-detail.md
        fields:
          - { name: type, widget: hidden, default: meetups-detail }
          - { name: backLabel, label: Back link label, widget: string }
          - { name: dateTimeHeading, label: Date and time heading, widget: string }
          - { name: locationHeading, label: Location heading, widget: string }
          - { name: openMapsLabel, label: Open in maps label, widget: string }
          - { name: rsvpLabel, label: RSVP label, widget: string }
          - { name: maxAttendeesLabel, label: Max attendees label, widget: string, hint: "{count} is replaced with the limit" }
          - { name: recurringLabel, label: Recurring label, widget: string }
          - { name: mapHeading, label: Map heading, widget: string }
          - { name: mapBody, label: Map body, widget: text }
          - { name: mapCtaLabel, label: Map button label, widget: string }
      - name: guides
        label: Guides page
        file: src/content/global/guides.md
        fields:
          - { name: type, widget: hidden, default: guides }
          - { name: pageTitle, label: Page title, widget: string }
          - { name: pageDescription, label: Page description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string }
              - { name: size, label: Size, widget: select, required: false, options: [small, large] }
          - name: empty
            label: Empty state
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
          - name: contribute
            label: Contribute
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
      - name: guides-detail
        label: Guide detail page
        file: src/content/global/guides-detail.md
        fields:
          - { name: type, widget: hidden, default: guides-detail }
          - { name: backLabel, label: Back link label, widget: string }
          - { name: prerequisitesHeading, label: Prerequisites heading, widget: string }
          - { name: relatedHeading, label: Related guides heading, widget: string }
          - name: feedback
            label: Feedback
            widget: object
            fields:
              - { name: question, label: Question, widget: string }
              - { name: reportLabel, label: Report label, widget: string }
              - { name: reportUrlTemplate, label: Report URL template, widget: string, hint: "{title} is replaced with the guide title" }
              - { name: improveLabel, label: Improve label, widget: string }
              - { name: improveUrl, label: Improve URL, widget: string }
      - name: resources
        label: Resources page
        file: src/content/global/resources.md
        fields:
          - { name: type, widget: hidden, default: resources }
          - { name: pageTitle, label: Page title, widget: string }
          - { name: pageDescription, label: Page description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string }
              - { name: size, label: Size, widget: select, required: false, options: [small, large] }
          - name: empty
            label: Empty state
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
          - name: quickStart
            label: Quick start
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
          - name: disclaimer
            label: Disclaimer
            widget: object
            fields:
              - { name: body, label: Body, widget: text }
      - name: map
        label: Map page
        file: src/content/global/map.md
        fields:
          - { name: type, widget: hidden, default: map }
          - { name: pageTitle, label: Page title, widget: string }
          - { name: pageDescription, label: Page description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string }
              - { name: size, label: Size, widget: select, required: false, options: [small, large] }
          - name: stats
            label: Stats
            widget: list
            required: false
            summary: "{{fields.label}} ({{fields.key}})"
            fields:
              - { name: key, label: Node type, widget: select, options: [total, relay, router, solar, client] }
              - { name: label, label: Label, widget: string }
              - { name: colorClass, label: Color class, widget: string, required: false, hint: "Tailwind text color, e.g. text-blue-600" }
          - name: map
            label: Map
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
          - name: empty
            label: Empty state
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
          - name: legend
            label: Legend
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: items
                label: Items
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: description, label: Description, widget: string }
                  - { name: colorClass, label: Color class, widget: string, hint: "Tailwind background color, e.g. bg-blue-500" }
          - name: addNode
            label: Add a node
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: variant, label: Variant, widget: select, required: false, options: [primary, secondary, outline, ghost] }
          - name: coverage
            label: Coverage
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - name: locations
                label: Locations
                widget: list
                required: false
                summary: "{{fields.label}} ({{fields.status}})"
                fields:
                  - { name: label, label: Label, widget: string }
                  - name: status
                    label: Status
                    widget: select
                    options:
                      - { label: Complete, value: complete }
                      - { label: In progress, value: progress }
                      - { label: Planned, value: planned }
          - name: externalMaps
            label: External maps
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: links
                label: Links
                widget: list
                required: false
                summary: "{{fields.label}} → {{fields.href}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
                  - { name: external, label: Opens in new tab, widget: boolean, required: false }
          - name: registeredNodes
            label: Registered nodes
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: table
                label: Table column headings
                widget: object
                fields:
