# Security response headers for chsmesh.org
#
# nginx's add_header directives are NOT inherited into a location block that
# declares any add_header of its own. This file therefore holds every security
# header in one place and must be `include`d in the server block AND in every
# location block that uses add_header, otherwise those responses ship with no
# security headers at all.
#
# __N8N_ORIGIN__ is a build-time placeholder. The Dockerfile builder stage
# derives scheme://host[:port] from every PUBLIC_N8N_*_WEBHOOK_URL build arg,
# dedupes them, and substitutes the list here so that connect-src allows the
# cross-origin n8n webhooks the forms POST to. When all build ARGs are empty the
# placeholder is replaced with the empty string and connect-src stays 'self'.
#
# $csp_admin_connect, $csp_admin_img, $csp_admin_font, $csp_admin_frame and
# $csp_admin_extra are nginx map variables defined in nginx.conf. They are
# empty for every URI except /admin/, where the Sveltia CMS needs GitHub's
# API, avatar images, fonts from jsdelivr and blob: URLs.
#
# https://challenges.cloudflare.com is Cloudflare Turnstile, which the public
# submission forms use for bot protection: its api.js is a script and the
# challenge itself runs in an iframe. Allowing the origin when no site key is
# configured is harmless because the page then never references it.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security $hsts_header always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: $csp_admin_img; font-src 'self' $csp_admin_font; connect-src 'self' __N8N_ORIGIN__ $csp_admin_connect; frame-src 'self' https://challenges.cloudflare.com $csp_admin_frame; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests; $csp_admin_extra" always;
